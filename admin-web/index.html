<!doctype html>
<!-- translate="no" + the notranslate meta stop Chrome from auto-translating the
     page. Without it Chrome saw lang="hi", translated everything to English, and
     kept re-translating — so the in-app EN/हिंदी toggle appeared to do nothing.
     The app owns the language now; document.documentElement.lang is kept in sync
     from setLang(). -->
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heritage Diagnostics — Admin</title>
  </head>
  <body class="notranslate">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
