# dapp.heritageimshospital.com — dashboard और API, दोनों एक ही domain पर।
#
# एक ही origin होने का मतलब है कि browser की कोई request cross-origin नहीं है, इसलिए
# CORS का कोई झंझट नहीं। APK भी इसी domain को call करता है।
#
#   /              → admin-web की static site (dist-web/)
#   /api/          → backend (127.0.0.1:5000)
#   /uploads/      → backend (prescriptions, reports)
#   /socket.io/    → backend, WebSocket upgrade के साथ
#
# Install:
#   sudo cp dapp.heritageimshospital.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/dapp.heritageimshospital.com.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dapp.heritageimshospital.com
#
# certbot इसी file में 443 का block और 80 → 443 का redirect खुद जोड़ देता है।

server {
    listen 80;
    listen [::]:80;
    server_name dapp.heritageimshospital.com;

    root /var/www/heritage-app/admin-web/dist-web;
    index index.html;

    # multer 8 MB तक की file लेता है (src/app.js)। nginx की default सीमा 1 MB है —
    # उसके बिना बड़ी prescription upload होते ही 413 मिलता, backend तक पहुँचती भी नहीं।
    client_max_body_size 12M;

    access_log /var/log/nginx/dapp.access.log;
    error_log  /var/log/nginx/dapp.error.log;

    # ---------------------------------------------------------------- backend --

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.io. Client `transports: ['websocket']` भेजता है (admin-web/src/live.ts),
    # यानी polling का fallback नहीं है — Upgrade headers के बिना real-time पूरी तरह
    # बंद हो जाएगा, और dashboard चुपचाप 20s की polling पर आ जाएगा।
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;              # idle socket बीच में न कटे
    }

    # -------------------------------------------------------------- dashboard --

    # Vite हर asset के नाम में hash डालता है, इसलिए ये कभी बदलते नहीं — लंबा cache
    # सुरक्षित है। index.html को कभी cache मत करने दें, वरना नया deploy पुराने
    # bundle की ओर इशारा करता रह जाएगा।
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: /orders जैसे routes की कोई file disk पर नहीं है — सब index.html पर जाएँ,
    # routing browser में होती है।
    location / {
        try_files $uri $uri/ /index.html;
    }
}
